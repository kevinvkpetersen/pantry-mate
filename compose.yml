name: pantry-mate

services:
  api:
    depends_on:
      db:
        condition: service_healthy
        restart: true
    build:
      dockerfile: apps/api/Dockerfile
      context: .
    restart: unless-stopped
    environment:
      API_PORT: ${API_PORT:-3000}
      # Inside the Compose network, Postgres listens on db:5432
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      # Delay + timeout must stay under Compose's stop_grace_period (10s by default)
      SHUTDOWN_DRAIN_DELAY_MS: ${SHUTDOWN_DRAIN_DELAY_MS:-2000}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-6000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '${API_PORT:-3000}:${API_PORT:-3000}'

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
    healthcheck:
      test: [
          'CMD-SHELL',
          # These env vars are the values inside the container
          'pg_isready -h localhost -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    ports:
      - '127.0.0.1:${DB_PORT:?Set DB_PORT in .env}:5432'
    volumes:
      - db_data:/var/lib/postgresql
      - ./docker/db/init:/docker-entrypoint-initdb.d:ro

volumes:
  db_data:
