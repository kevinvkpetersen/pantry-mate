name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
        with:
          # The jobs never push, so later steps don't need the token.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The jobs never push, so later steps don't need the token.
          persist-credentials: false

      # Fails on any Dockerfile lint warning, like the pre-commit hook does.
      - run: docker build --check -f apps/api/Dockerfile .

      - run: docker build --target prod -t pantry-mate-api:ci -f apps/api/Dockerfile .

      # Starts the image to catch problems a build can't, such as a package the
      # compiled code can't load. The pool connects lazily, so no database is needed.
      - name: Smoke test the prod image
        run: |
          docker run -d --name api-smoke \
            -e DB_HOST=db.invalid -e DB_PORT=5432 \
            -e DB_USER=ci -e DB_PASSWORD=ci -e DB_NAME=ci \
            pantry-mate-api:ci
          for _ in $(seq 1 15); do
            if docker logs api-smoke 2>&1 | grep -q '"msg":"Listening"'; then
              echo "API started"
              exit 0
            fi
            if [ "$(docker inspect -f '{{.State.Running}}' api-smoke)" != "true" ]; then
              break
            fi
            sleep 1
          done
          echo "API did not start"
          docker logs api-smoke
          exit 1
